# General laptop facilities whose upstream state can legitimately differ by
# kernel variant. KernelForge must preserve that state in either direction.
# CachyOS Hardened, for example, deliberately ships without hibernation.
PRESERVE_BASELINE_STATE=(
    HIBERNATION
)

# Firmware/platform drivers for other computer families. These drivers bind to
# the host motherboard/ACPI/WMI platform; they are not drivers for detachable
# consumer peripherals made by the same vendors.
