# Universal x86-64 ThinkPad kernel profile

PROFILE_NAME="thinkpad"
PROFILE_VERSION="0.1"

# Build policy
#
# KernelForge is intended to be run on the target ThinkPad. Native CPU
# optimization is therefore safe for the locally built kernel, while the
# hardware allowlist below remains independent from the current host inventory.
PROCESSOR_OPT="native"
TICKRATE="idle"

# Profile invariants changed deliberately by KernelForge.
REQUIRE_ENABLED_BOOL=(
    X86_NATIVE_CPU
    NO_HZ_IDLE
)

REQUIRE_DISABLED=(
    NO_HZ_FULL
    HZ_PERIODIC
)

# Universal ThinkPad contract. These are ordinary laptop facilities that must
# remain available regardless of which ThinkPad performs the build.
PRESERVE_ENABLED=(
    ACPI
    ACPI_AC
    ACPI_BATTERY
    ACPI_BUTTON
    ACPI_FAN
    ACPI_PROCESSOR
    ACPI_THERMAL
    ACPI_VIDEO
    ACPI_WMI
    ACPI_PLATFORM_PROFILE
