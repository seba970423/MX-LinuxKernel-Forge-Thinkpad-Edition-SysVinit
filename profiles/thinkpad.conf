    INTEL_IDLE
    POWER_SUPPLY
    HWMON
    THERMAL
    BACKLIGHT_CLASS_DEVICE
    LCD_CLASS_DEVICE
    INPUT_SPARSEKMAP
    RFKILL
    LEDS_CLASS
    EFI
    FW_LOADER
