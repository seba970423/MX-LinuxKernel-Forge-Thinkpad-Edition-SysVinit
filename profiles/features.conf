# ThinkPad feature defaults

# General-purpose capabilities default to preserving upstream. The builder may
# remove them only after an explicit user choice.
DEFAULT_KEEP_KVM="yes"
DEFAULT_KEEP_INTEL_TDX="yes"
DEFAULT_KEEP_AMD_SEV="yes"

# Specialized NVMe transports and target functionality are preserved from
# upstream. Laptop-oriented policy must not break an existing userspace setup.
DEFAULT_KEEP_NVME_FABRICS="yes"
DEFAULT_KEEP_NVME_TARGET="yes"

# Preserve the selected variant's frequency unless explicitly overridden.
# Independent from tickless mode, autogrouping and transparent hugepages.
DEFAULT_KERNEL_HZ="upstream"
